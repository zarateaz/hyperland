# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #

# you can choose themes from $HOME/.config/kitty/kitty-themes/
include ./kitty-themes/01-Wallust.conf

font_family FantasqueSansM Nerd Font Mono Bold
font_size 14.0
bold_font auto
italic_font auto
bold_italic_font auto

background_opacity 0.9
dynamic_background_opacity 1
confirm_os_window_close 0
remember_window_size no
initial_window_width 900
initial_window_height 600

# Animated cursor
cursor_trail 1

# change to x11 or wayland or leave auto
linux_display_server auto

scrollback_lines 2000
wheel_scroll_min_lines 1

enable_audio_bell no

window_padding_width 4



# Usar zsh siempre (autosuggestions / p10k)
shell /usr/bin/zsh

# ─────────────────────────────────────────────────────────────
# 🪟 Doble Ventana / Splits en la CLI (Kitty)
# ─────────────────────────────────────────────────────────────
enabled_layouts splits,stack,tall,fat,grid,horizontal,vertical

# Abrir doble ventana vertical (lado a lado) en la CLI manteniendo el directorio
map ctrl+shift+enter launch --location=vsplit --cwd=current
map ctrl+shift+d launch --location=vsplit --cwd=current

# Abrir doble ventana horizontal (arriba / abajo) manteniendo el directorio
map ctrl+shift+o launch --location=hsplit --cwd=current

# Cerrar panel o ventana dividida actual
map ctrl+shift+w close_window

# Alternar panel completo (Zoom / Unzoom del panel activo en la CLI)
map ctrl+shift+z toggle_layout stack

# Navegar entre las ventanas divididas (flechas y vim-keys)
map ctrl+shift+left neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up neighboring_window up
map ctrl+shift+down neighboring_window down
map ctrl+shift+h neighboring_window left
map ctrl+shift+l neighboring_window right
map ctrl+shift+k neighboring_window up
map ctrl+shift+j neighboring_window down

# Redimensionar divisiones de la CLI
map ctrl+shift+alt+left resize_window narrower 5
map ctrl+shift+alt+right resize_window wider 5
map ctrl+shift+alt+up resize_window taller 5
map ctrl+shift+alt+down resize_window shorter 5

# Pestañas en la CLI
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+q close_tab

